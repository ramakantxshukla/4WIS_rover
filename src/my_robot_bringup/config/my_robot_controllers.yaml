controller_manager:
  ros__parameters:
    update_rate: 50

    # Combined wheel velocity controller
    wheel_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    # Combined steering position controller
    steering_position_controller:
      type: position_controllers/JointGroupPositionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

# All wheel velocities controlled together
wheel_velocity_controller:
  ros__parameters:
    joints:
      - base_front_left_wheel_joint
      - base_front_right_wheel_joint
      - base_rear_left_wheel_joint
      - base_rear_right_wheel_joint

# All steering angles controlled together
steering_position_controller:
  ros__parameters:
    joints:
      - base_front_left_steering_joint
      - base_front_right_steering_joint
      - base_rear_left_steering_joint
      - base_rear_right_steering_joint
